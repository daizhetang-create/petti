function initQuiz() {
  injectChrome();
  const hashQ = (location.hash.split('?')[1] || '');
  const params = new URLSearchParams(location.search || hashQ);
  const species = params.get('s') || (Store.load() || {}).species || 'cat';
  const QSET = speciesPack(species).Q;
  const total = QSET.length;
  let i = 0;
  const answers = new Array(total).fill(null);

  const $species = document.querySelector('[data-species-label]');
  const $num = document.querySelector('[data-qnum]');
  const $progress = document.querySelector('[data-progress]');
  const $bar = document.querySelector('[data-bar]');
  const $q = document.querySelector('[data-q]');
  const $opts = document.querySelector('[data-opts]');
  const $prev = document.querySelector('[data-prev]');
  const $skip = document.querySelector('[data-skip]');

  if ($species) $species.textContent = speciesLabel(species);

  function render() {
    const cur = QSET[i];
    $num.textContent = String(i+1).padStart(2,'0');
    $progress.textContent = `${String(i+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}`;
    $bar.style.setProperty('--p', `${((i)/total)*100}%`);
    $q.textContent = cur.q;
    $opts.innerHTML = '';
    cur.opts.forEach((o, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = `
        <span class="letter">${String.fromCharCode(65+idx)}</span>
        <span class="text">${o.t}</span>
        <span class="plus">SELECT →</span>
      `;
      btn.addEventListener('click', () => {
        answers[i] = idx;
        if (i < total - 1) {
          i++;
          render();
        } else {
          finish();
        }
      });
      $opts.appendChild(btn);
    });
    $prev.disabled = i === 0;
  }
  $prev.addEventListener('click', () => { if (i > 0) { i--; render(); } });

  function finish() {
    $bar.style.setProperty('--p', `100%`);
    const sess = Store.load() || {};
    const result = computeResult(species, answers);
    result.petName = sess.petName || speciesDefault(species);
    result.petAge = sess.petAge || '';
    Store.saveResult(result);
    // analyzing animation — use overlay so SPA templates stay intact
    const overlay = document.createElement('div');
    overlay.id = 'analyzing-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:var(--paper,#EFE8DA);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;';
    overlay.innerHTML = `
      <div style="text-align:left;max-width:480px;padding:0 32px;">
        <div style="font-family:var(--serif,'Noto Serif SC',serif);font-size:clamp(40px,8vw,72px);font-weight:700;letter-spacing:-0.02em;margin-bottom:40px;">建档中<span style="font-style:italic;">…</span></div>
        <div id="analyzing-lines" style="font-family:var(--mono,'IBM Plex Mono',monospace);font-size:13px;letter-spacing:0.12em;line-height:2.2;color:var(--ink,#1A1917);opacity:0.75;"></div>
      </div>
    `;
    document.body.appendChild(overlay);
    const lines = [
      '> CONNECTING TO PetTI ARCHIVE',
      '> 校准亲近指数…',
      '> 比对纸箱依赖度…',
      '> 分析推杯频率…',
      '> 反查窗台冥想时长…',
      '> 鉴定主人服从度…',
      '> 编号生成 № PT-' + result.id,
      '> 档案完成。',
    ];
    const $l = document.getElementById('analyzing-lines');
    lines.forEach((t, n) => {
      setTimeout(() => {
        const d = document.createElement('div');
        d.textContent = t;
        if ($l) $l.appendChild(d);
      }, n * 380);
    });
    setTimeout(() => {
      location.href = '#result';
    }, lines.length * 380 + 600);
  }

  render();
}

/* ---------- Result page ---------- */
function buildRadarSVG(vector, dims) {
  const keys = Object.keys(dims);
  const n = keys.length;
  const size = 320;
  const cx = size/2, cy = size/2;
  const R = 130;
  const angle = (idx) => (Math.PI * 2 * idx) / n - Math.PI/2;

  // grid rings
  const rings = [0.25, 0.5, 0.75, 1].map(scale => {
    const pts = keys.map((_, i) => {
      const a = angle(i);
      return `${cx + Math.cos(a)*R*scale},${cy + Math.sin(a)*R*scale}`;
    }).join(' ');
    return `<polygon class="grid" points="${pts}"/>`;
  }).join('');

  // axis lines
  const axes = keys.map((_, i) => {
    const a = angle(i);
    return `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(a)*R}" y2="${cy + Math.sin(a)*R}"/>`;
  }).join('');

  // data polygon
  const dpts = keys.map((k, i) => {
    const a = angle(i);
    const r = R * (vector[k] / 100);
    return `${cx + Math.cos(a)*r},${cy + Math.sin(a)*r}`;
  }).join(' ');

  // data dots
  const dots = keys.map((k, i) => {
    const a = angle(i);
    const r = R * (vector[k] / 100);
    return `<circle class="dot" cx="${cx + Math.cos(a)*r}" cy="${cy + Math.sin(a)*r}" r="3"/>`;
  }).join('');

  // labels
  const labels = keys.map((k, i) => {
    const a = angle(i);
    const lr = R + 22;
    const x = cx + Math.cos(a)*lr;
    const y = cy + Math.sin(a)*lr;
    const anchor = Math.cos(a) > 0.2 ? 'start' : Math.cos(a) < -0.2 ? 'end' : 'middle';
    return `<text x="${x}" y="${y}" text-anchor="${anchor}" dy="4">${k}</text>`;
  }).join('');

  return `<svg class="radar" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
    ${rings}
    ${axes}
    <polygon class="data" points="${dpts}"/>
    ${dots}
    ${labels}
  </svg>`;
}

/* ---------- Live counter (mock, persistent) ---------- */
function liveCounterValue() {
  // anchor: 2025-01-01 → grow by ~37/min
  const start = new Date('2025-01-01T00:00:00Z').getTime();
  const now = Date.now();
  const minutes = (now - start) / 60000;
  return 12480 + Math.floor(minutes * 0.37);
}
function injectLiveCounter() {
  const slots = document.querySelectorAll('[data-live-counter]');
  if (!slots.length) return;
  let v = liveCounterValue();
  slots.forEach(s => s.innerHTML = `<span class="live-counter">LIVE · 已在档 <strong>${v.toLocaleString()}</strong> 只</span>`);
  setInterval(() => {
    v += Math.random() > 0.5 ? 1 : 0;
    slots.forEach(s => {
      const strong = s.querySelector('strong');
      if (strong) strong.textContent = v.toLocaleString();
    });
  }, 2200);
}

/* ---------- Scroll reveal ---------- */
function initScrollReveal() {
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('on');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
  document.querySelectorAll('.reveal, .reveal-stagger').forEach(el => io.observe(el));
}

function initStickyTopbar() {

    const y = window.scrollY;
    if (y > 80) tb.classList.add('compact');
    else tb.classList.remove('compact');

/* ---------- Count up number ---------- */
function countUp(el, target, dur = 1400) {
  if (!el) return;
  const start = performance.now();
  const tick = (t) => {
    const k = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(target * eased) + '%';
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* ---------- Mouse parallax on specimen ---------- */
function initSpecimenParallax() {
  const card = document.querySelector('.specimen');
  if (!card) return;
  const wrap = card.parentElement;
  wrap.addEventListener('mousemove', (e) => {
    const rect = wrap.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    card.style.transform = `rotate(${-2.3 + x * 1.2}deg) translate(${x*10}px, ${y*10}px) perspective(900px) rotateY(${x*-3}deg) rotateX(${y*3}deg)`;
  });
  wrap.addEventListener('mouseleave', () => {
    card.style.transform = 'rotate(-2.3deg)';
  });
}

/* ---------- PNG Export (using html2canvas via CDN) ---------- */
function loadHtml2Canvas() {
  return new Promise((resolve, reject) => {
    if (window.html2canvas) return resolve(window.html2canvas);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = () => resolve(window.html2canvas);
    s.onerror = reject;
    document.head.appendChild(s);
  });
}
async function exportCardPNG(cardEl, filename) {
  try {
    const h2c = await loadHtml2Canvas();
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await h2c(cardEl, { backgroundColor: null, scale: 3, useCORS: true });
    const link = document.createElement('a');
    link.download = filename;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (e) {
    alert('导出失败，请截图保存');
  }
}

/* ---------- Couple test ---------- */
function initCouple() {
  injectChrome();
  const r = Store.loadResult();
  if (!r) { location.href = '#home'; return; }

  const QSET = PETTI_DATA.OWNER_QUESTIONS;
  const total = QSET.length;
  let i = 0;
  const answers = new Array(total).fill(null);

  const $shell = document.querySelector('[data-couple-quiz]');
  const $result = document.querySelector('[data-couple-result]');

  function render() {
    const cur = QSET[i];
    $shell.innerHTML = `
      <div class="quiz-progress">
        <span>你 × ${r.petName} · 匹配测试</span>
        <span class="bar" style="--p:${(i/total)*100}%"></span>
        <span>${String(i+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</span>
      </div>
      <div class="q-num slide-in">Question № ${String(i+1).padStart(2,'0')}</div>
      <h2 class="q-text slide-in">${cur.q}</h2>
      <div class="options" data-opts></div>
      <div class="quiz-nav">
        <button data-prev>← 上一题</button>
        <a href="#result" style="color:var(--ash);">返回档案 ✕</a>
      </div>
    `;
    const $opts = $shell.querySelector('[data-opts]');
    cur.opts.forEach((o, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt slide-in';
      btn.innerHTML = `<span class="letter">${String.fromCharCode(65+idx)}</span><span>${o.t}</span><span class="plus">SELECT →</span>`;
      btn.addEventListener('click', () => {
        answers[i] = idx;
        if (i < total - 1) { i++; render(); } else finish();
      });
      $opts.appendChild(btn);
    });
    $shell.querySelector('[data-prev]').addEventListener('click', () => { if (i > 0) { i--; render(); } });
    $shell.querySelector('[data-prev]').disabled = i === 0;
  }

  function finish() {
    // compute owner vector
    const raw = {};
    Object.keys(PETTI_DATA.OWNER_DIMS).forEach(k => raw[k] = 0);
    answers.forEach((a, ix) => {
      const opt = QSET[ix].opts[a];
      if (!opt) return;
      Object.entries(opt.s).forEach(([k, v]) => raw[k] = (raw[k] || 0) + v);
    });
    const ownerVec = normalize(raw, PETTI_DATA.OWNER_DIMS);

    // map owner dims → comparable to pet dims
    // bridge: pet ATT ~ owner ATT, pet NRG ~ owner NRG, pet SEN ~ owner SEN
    // for missing cross-dims, average
    const pv = r.vector;
    const ov = ownerVec;
    // pull comparable axes
    const pairs = [];
    if (pv.ATT != null && ov.ATT != null) pairs.push([pv.ATT, ov.ATT]);
    if (pv.NRG != null && ov.NRG != null) pairs.push([pv.NRG, ov.NRG]);
    if (pv.SEN != null && ov.SEN != null) pairs.push([pv.SEN, ov.SEN]);
    if (pv.SOC != null && ov.SOC != null) pairs.push([pv.SOC, ov.SOC]);

    // compatibility = 100 - average abs diff scaled
    let diff = 0;
    pairs.forEach(([a,b]) => diff += Math.abs(a - b));
    const avg = pairs.length ? diff / pairs.length : 30;
    let compat = Math.round(100 - avg * 0.7);
    // add random jitter so two same answers ≠ same result for different pets
    compat += Math.floor(Math.random()*6) - 3;
    compat = Math.max(55, Math.min(96, compat));

    const verdict = PETTI_DATA.generateCoupleVerdict(compat, r.main, ov);

    $shell.style.display = 'none';
    $result.style.display = 'block';
    $result.innerHTML = `
      <div class="couple-result reveal on">
        <div class="label-row">
          <span>YOU</span>
          <span style="font-family:var(--serif); font-style:italic; font-size:36px; color:var(--mark);">×</span>
          <span>${r.petName.toUpperCase()}</span>
        </div>
        <div class="pct-big" data-pct-big>0%</div>
        <div class="eyebrow" style="margin-top:24px; color:var(--mark);">${verdict.title}</div>
        <p class="verdict">${verdict.text}</p>
        <div style="margin-top: 48px; display:flex; justify-content:center; gap: 18px; flex-wrap: wrap;">
          <a href="#result" class="btn-primary"><span class="arr">←</span> 返回档案</a>
          <button class="btn-primary" data-share-couple style="background:var(--mark);">复制匹配文案 <span class="arr">↗</span></button>
        </div>
      </div>
    `;
    const $pct = $result.querySelector('[data-pct-big]');
    const start = performance.now();
    const dur = 1600;
    const tick = (t) => {
      const k = Math.min(1, (t-start)/dur);
      const e = 1 - Math.pow(1-k, 3);
      $pct.textContent = Math.round(compat * e) + '%';
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);

    $result.querySelector('[data-share-couple]').addEventListener('click', () => {
      const txt = `我和我家${r.petName}的匹配度是 ${compat}%（${verdict.title}）\n它是 ${r.main.code}·${r.main.name}，我们是 ${verdict.title}。\n你和你家的呢？→ pet-ti.com`;
      navigator.clipboard.writeText(txt).then(() => {
        const b = $result.querySelector('[data-share-couple]');
        b.textContent = '已复制 ✓';
      });
    });
  }

  render();
}

function injectFoyerWall() {
  const $list = document.querySelector('[data-foyer-list]');
  const $date = document.querySelector('[data-foyer-date]');
  if (!$list || !window.PETTI_MUSEUM) return;
  if ($date) $date.textContent = dateLabel();
  // Show 4 rotating confessions from seed (date-deterministic)
  const seed = window.PETTI_MUSEUM.CONFESSIONS_SEED;
  const r = mulberry32(dailySeed(3));
  const picks = [];
  const used = new Set();
  while (picks.length < 4 && used.size < seed.length) {
    const i = Math.floor(r() * seed.length);
    if (!used.has(i)) { used.add(i); picks.push({...seed[i], idx: i}); }
  }
  $list.innerHTML = picks.map((s, i) => `
    <div class="row">
      <div class="meta">№ ${buildNoteId(s.t)} · ${s.sp.toUpperCase()}</div>
      ${escapeHtml(s.t)}
    </div>
  `).join('');
}

const LAB_KEY = 'petti.lab.v1';
const Lab = {
  load() {
    try { return JSON.parse(localStorage.getItem(LAB_KEY) || '[]'); }
    catch { return []; }
  },
  save(list) { localStorage.setItem(LAB_KEY, JSON.stringify(list)); },
  add(entry) {
    const list = Lab.load();
    // upsert by id
    const i = list.findIndex(x => x.id === entry.id);
    if (i >= 0) list[i] = entry;
    else list.unshift(entry);
    // cap at 12
    if (list.length > 12) list.length = 12;
    Lab.save(list);
  },
  remove(id) {
    Lab.save(Lab.load().filter(x => x.id !== id));
  },
  has(id) { return Lab.load().some(x => x.id === id); },
};

function showCompat(a, b) {
  // simple cross-species vector cosine
  const keysA = Object.keys(a.vector);
  const keysB = Object.keys(b.vector);
  const shared = keysA.filter(k => keysB.includes(k));
  let pct;
  if (shared.length >= 2) {
    let dot=0, na=0, nb=0;
    shared.forEach(k => { dot += a.vector[k]*b.vector[k]; na += a.vector[k]**2; nb += b.vector[k]**2; });
    const sim = dot / (Math.sqrt(na)*Math.sqrt(nb) || 1);
    pct = Math.round(58 + sim * 38); // 58–96
  } else {
    // cross-species: synthesize an "energy fit" via averaged divergence
    const avgA = Object.values(a.vector).reduce((s,v)=>s+v,0) / keysA.length;
    const avgB = Object.values(b.vector).reduce((s,v)=>s+v,0) / keysB.length;
    pct = Math.round(96 - Math.abs(avgA - avgB) * 0.6);
  }
  pct = Math.max(52, Math.min(97, pct));

  let title, text;
  if (pct >= 88) { title = '神仙搭子'; text = '气场对得上，节奏对得上，你家这俩简直前世已订。'; }
  else if (pct >= 78) { title = '好麻吉'; text = '互相懂、互相忍。偶尔吵架但很快和好。稳定的合伙人关系。'; }
  else if (pct >= 68) { title = '互补型'; text = '差得有点远，但刚好你缺的它有。看似不合，实则刚好。'; }
  else if (pct >= 60) { title = '磨合期'; text = '还在互相试探。你看它像谜，它看你也像谜。给彼此一点时间。'; }
  else { title = '反差萌'; text = '你俩根本是两个物种…… 等等，确实是。但反差才有故事。'; }

  const $modal = document.getElementById('compatModal');
  const $body = document.querySelector('[data-compat-result]');
  if (!$modal || !$body) return;
  const avA = window.getAvatar ? window.getAvatar(a.species, a.mainCode) : '';
  const avB = window.getAvatar ? window.getAvatar(b.species, b.mainCode) : '';
  $body.innerHTML = `
    <div class="eyebrow" style="margin-bottom: 10px;">CROSS-SUBJECT · 跨档案兼容鉴定</div>
    <div class="pair">
      <div>
        <div class="av">${avA}</div>
        <div style="margin-top: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;">${a.petName}</div>
        <div style="font-family: var(--serif); font-style: italic; color: var(--ash); font-size: 12px;">${a.mainName}</div>
      </div>
      <div class="x">×</div>
      <div>
        <div class="av">${avB}</div>
        <div style="margin-top: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;">${b.petName}</div>
        <div style="font-family: var(--serif); font-style: italic; color: var(--ash); font-size: 12px;">${b.mainName}</div>
      </div>
    </div>
    <div class="pct"><span class="pct-it">${pct}</span>%</div>
    <div class="verdict-title">${title}</div>
    <div class="verdict-text">${text}</div>
  `;
  $modal.style.display = 'flex';
  $modal.classList.add('on');
  const closeBtn = $modal.querySelector('.close');
  $modal.onclick = (ev) => {
    if (ev.target === $modal || ev.target === closeBtn) {
      $modal.classList.remove('on');
      $modal.style.display = 'none';
    }
  };
}

const REPLIES_KEY = 'qinqi.replies.v1';
const Replies = {
  load() { try { return JSON.parse(localStorage.getItem(REPLIES_KEY) || '[]'); } catch { return []; } },
  save(list) { localStorage.setItem(REPLIES_KEY, JSON.stringify(list)); },
  add(entry) {
    const list = Replies.load();
    const i = list.findIndex(x => x.dayKey === entry.dayKey);
    if (i >= 0) list[i] = entry;
    else list.unshift(entry);
    Replies.save(list);
  },
  remove(dayKey) {
    Replies.save(Replies.load().filter(x => x.dayKey !== dayKey));
  },
  forDayKey(k) {
    return Replies.load().find(x => x.dayKey === k);
  },
};

function dayKey(d) {
  d = d || new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function chineseDateLong(d) {
  d = d || new Date();
  return `${d.getFullYear()} 年 ${String(d.getMonth()+1).padStart(2,'0')} 月 ${String(d.getDate()).padStart(2,'0')} 日`;
}

function letterForDate(d) {
  d = d || new Date();
  const seed = d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + d.getDate();
  if (!window.LETTERS_DATA) return null;
  const idx = seed % window.LETTERS_DATA.LETTERS.length;
  return { ...window.LETTERS_DATA.LETTERS[idx], idx };
}

function promptForDate(d) {
  d = d || new Date();
  const seed = d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + d.getDate() + 17;
  if (!window.LETTERS_DATA) return '';
  return window.LETTERS_DATA.PROMPTS[seed % window.LETTERS_DATA.PROMPTS.length];
}

function letterIdFor(d) {
  d = d || new Date();
  const start = new Date('2025-01-01');
  const day = Math.floor((d - start) / 86400000) + 1;
  return 'QQ-' + String(day).padStart(4, '0');
}

initIndex = function() {

  const $sub   = document.querySelector('[data-qr-submit]');

  const todayKey = dayKey(today);

      $input.value = existing.answer;

      if ($saved) $saved.style.display = 'block';

      if ($saved) $saved.style.display = 'none';

    });
  }

function dailySeed(offset) {
  // deterministic seed from date
  const d = new Date();
  const s = d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + d.getDate();
  return s + (offset||0);
}
function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}
function dateLabel() {
  const d = new Date();
  const mn = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()];
  return `${String(d.getDate()).padStart(2,'0')} ${mn} ${d.getFullYear()}`;
}
function chineseDate() {
  const d = new Date();
  return `${d.getFullYear()} 年 ${String(d.getMonth()+1).padStart(2,'0')} 月 ${String(d.getDate()).padStart(2,'0')} 日`;
}

function pickNote(seed) {
  return WALL_NOTES[seed % WALL_NOTES.length];
}

function buildNoteId(t) {
  // hash from text
  let h = 0;
  for (let i = 0; i < t.length; i++) h = ((h<<5)-h) + t.charCodeAt(i), h|=0;
  return 'PT-' + Math.abs(h).toString(36).slice(0,6).toUpperCase();
}

function initWall() {
  injectChrome('wall');
  initStickyTopbar();
  initScrollReveal();

  if (!window.PETTI_MUSEUM) return;
  const seed = window.PETTI_MUSEUM.CONFESSIONS_SEED;
  const $grid = document.querySelector('[data-wall-grid]');
  const $input = document.querySelector('[data-wall-input]');
  const $submit = document.querySelector('[data-wall-submit]');
  const $count = document.querySelector('[data-wall-count]');
  const $species = document.querySelectorAll('[data-sp]');
  const $tabs = document.querySelectorAll('.wall-tab');
  if (!$grid) return;

  let pickedSp = 'cat';
  $species.forEach(b => {
    if (b.dataset.sp === 'cat') b.classList.add('on');
    b.addEventListener('click', () => {
      $species.forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      pickedSp = b.dataset.sp;
    });
  });

  if ($input && $count) {
    const upd = () => { $count.textContent = `${$input.value.length} / 240`; };
    $input.addEventListener('input', upd); upd();
  }

  let activeFilter = 'all';
  function render() {
    const mine = Wall.loadMine();
    let all = [
      ...mine.map(m => ({ ...m, mine: true })),
      ...seed.map((s, i) => ({
        id: buildNoteId(s.t),
        sp: s.sp,
        t: s.t,
        note: s.note,
        mine: false,
        idx: i,
      })),
    ];
    if (activeFilter === 'mine') all = all.filter(x => x.mine);
    else if (activeFilter !== 'all') all = all.filter(x => x.sp === activeFilter);

    $grid.innerHTML = '';
    if (all.length === 0) {
      $grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 24px;font-family:var(--serif);font-style:italic;color:var(--ash);font-size:20px;">空空如也<span style="color:var(--ink);">.</span></div>`;
      return;
    }
    all.forEach((e, i) => {
      const $n = document.createElement('article');
      $n.className = 'wall-note' + (e.mine ? ' mine' : '');
      const spLabel = e.sp === 'cat' ? 'CAT' : e.sp === 'dog' ? 'DOG' : e.sp === 'rab' ? 'RAB' : 'OTH';
      const date = e.date || `${spLabel}-${String((e.idx || i) % 365 + 1).padStart(3,'0')}`;
      $n.innerHTML = `
        ${e.mine ? '<button class="wn-del" title="移除">✕</button>' : ''}
        <div class="wn-no"><span>№ ${e.id}</span><span>${date}</span></div>
        <span class="wn-sp">${spLabel}</span>
        <div class="wn-body">${escapeHtml(e.t)}</div>
        <div class="wn-note">${escapeHtml(e.note || pickNote(i*7+13))}</div>
      `;
      if (e.mine) {
        $n.querySelector('.wn-del').addEventListener('click', () => {
          Wall.remove(e.id);
          render();
        });
      }
      $grid.appendChild($n);
    });
  }

  $tabs.forEach(t => t.addEventListener('click', () => {
    $tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeFilter = t.dataset.filter;
    render();
  }));

  if ($submit) {
    $submit.addEventListener('click', () => {
      const txt = ($input.value || '').trim();
      if (!txt || txt.length < 4) {
        $input.style.borderBottom = '2px solid var(--mark)';
        $input.focus();
        setTimeout(() => $input.style.borderBottom = '', 1200);
        return;
      }
      const entry = {
        id: 'MY-' + Math.random().toString(36).slice(2,8).toUpperCase(),
        sp: pickedSp,
        t: txt,
        note: pickNote(Date.now() % 1000),
        date: dateLabel().split(' ').slice(0,2).join(' '),
        when: Date.now(),
      };
      Wall.add(entry);
      $input.value = '';
      if ($count) $count.textContent = '0 / 240';
      activeFilter = 'mine';
      $tabs.forEach(x => x.classList.toggle('active', x.dataset.filter === 'mine'));
      render();
      // toast
      const toast = document.createElement('div');
      toast.textContent = '已归入档案 №' + entry.id;
      toast.style.cssText = 'position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:14px 22px;font-family:var(--mono);font-size:11px;letter-spacing:0.2em;z-index:9999;animation:fadeOut 2.4s forwards;';
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2400);
    });
  }

  render();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function initDaily() {
  injectChrome('daily');
  initStickyTopbar();
  initScrollReveal();

  if (!window.PETTI_MUSEUM) return;
  const { DIARY_ENTRIES, QUOTES } = window.PETTI_MUSEUM;
  const rand = mulberry32(dailySeed(0));
  const idx = Math.floor(rand() * DIARY_ENTRIES.length);
  const diary = DIARY_ENTRIES[idx];
  const qidx = Math.floor(mulberry32(dailySeed(7))() * QUOTES.length);

  // Date
  const $date = document.querySelector('[data-daily-date]');
  if ($date) $date.textContent = chineseDate();
  const $vol = document.querySelector('[data-daily-vol]');
  if ($vol) {
    const d = new Date();
    const dayOfYear = Math.floor((d - new Date(d.getFullYear(),0,0)) / 86400000);
    $vol.textContent = `Vol. 01 · No. ${String(dayOfYear).padStart(3,'0')}`;
  }

  // Diary
  const $title = document.querySelector('[data-daily-title]');
  const $text = document.querySelector('[data-daily-text]');
  if ($title) $title.textContent = diary.title;
  if ($text) $text.textContent = diary.text;

  // Quote
  const $quote = document.querySelector('[data-daily-quote]');
  if ($quote) $quote.textContent = '「' + QUOTES[qidx] + '」';

  // Horoscope from user's lab
  const $horos = document.querySelector('[data-daily-horos]');
  const $horosEmpty = document.querySelector('[data-horos-empty]');
  const labList = (typeof Lab !== 'undefined') ? Lab.load() : [];

    if (labList.length === 0) {
      $horos.innerHTML = '<p style="font-family:var(--serif);font-style:italic;color:var(--ash);font-size:16px;margin-top:8px;">档案室还没有宠物 — 鉴定后存进来，这里会显示今日运势。</p>';
      if ($horosEmpty) $horosEmpty.style.display = 'inline-block';
    } else {
      const fortunes = generateFortunes(labList);
      $horos.innerHTML = fortunes.map(f => `
        <div class="horos-row">
          <div class="horos-av">${window.getAvatar ? window.getAvatar(f.species, f.mainCode) : ''}</div>
          <div>
            <div class="horos-name">${escapeHtml(f.petName)}</div>
            <div class="horos-tag">${f.mainCode} · ${escapeHtml(f.mainName)}</div>
            <div class="horos-line">宜 / ${escapeHtml(f.good)} &nbsp; 忌 / ${escapeHtml(f.bad)}</div>
          </div>
        </div>
      `).join('');
    }
  }

  // Feature (rotating persona of the day)
  const $feat = document.querySelector('[data-daily-feature]');
  if ($feat) {
    const allPersonas = [
      ...PETTI_DATA.CAT_PERSONAS.map(p => ({...p, sp:'cat', prefix:'CatTI'})),
      ...PETTI_DATA.DOG_PERSONAS.map(p => ({...p, sp:'dog', prefix:'DogTI'})),
      ...PETTI_DATA.RAB_PERSONAS.map(p => ({...p, sp:'rab', prefix:'RabTI'})),
    ];
    const featIdx = Math.floor(mulberry32(dailySeed(11))() * allPersonas.length);
    const f = allPersonas[featIdx];
    const av = window.getAvatar ? window.getAvatar(f.sp, f.code) : '';
    $feat.innerHTML = `
      <div class="daily-feature-av">${av}</div>
      <div class="daily-feature-meta">
        <div class="fm-no">${f.prefix} · ${f.code} · 今日重点</div>
        <div class="fm-name">${escapeHtml(f.name)}</div>
        <div class="fm-q">「${escapeHtml(f.quote)}」</div>
        <a href="#dex" style="display:inline-block;margin-top:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:0.2em;border-bottom:1px solid var(--ink);padding-bottom:2px;">看全档案 →</a>
      </div>
    `;
  }
}

];

function generateFortunes(labList) {
  // for each pet, deterministic daily fortune
  return labList.slice(0, 4).map((pet, i) => {
    const seed = dailySeed(i * 3 + pet.id);
    const r = mulberry32(seed);
    const good = HOROS_GOOD[Math.floor(r() * HOROS_GOOD.length)];
    const bad = HOROS_BAD[Math.floor(r() * HOROS_BAD.length)];
    return { ...pet, good, bad };
  });
}


/* ---------- Bootstrap (SPA router) ---------- */
const _initMap = { home: initIndex, index: initIndex, info: initInfo, quiz: initQuiz, result: initResult, dex: initDex, couple: initCouple, about: initAbout, lab: initLab, wall: initWall, daily: initDaily, archive: initArchive, journal: initJournal };
function parseRoute() {
  const h = location.hash.slice(1) || 'home';
  const [route, query] = h.split('?');
  return { route, params: new URLSearchParams(query || '') };
}
function showRoute() {
  const { route, params } = parseRoute();
  const tpl = document.getElementById('route-' + route);
  const out = document.getElementById('router-outlet');
  if (!tpl) { location.hash = '#home'; return; }
  // Remove analyzing overlay if present
  const overlay = document.getElementById('analyzing-overlay');
  if (overlay) overlay.remove();
  // Save species param into session so init functions see it
  if (params.get('s')) {
    const sess = Store.load() || {};
    sess.species = params.get('s');
    Store.save(sess);
  }
  out.innerHTML = '';
  out.appendChild(tpl.content.cloneNode(true));
  document.body.dataset.page = route === 'home' ? 'index' : route;
  // cinematic enter
  out.classList.remove('page-enter');
  void out.offsetWidth;
  out.classList.add('page-enter');
  // Patch URLSearchParams to read from hash for the moment of init
  const origSearch = Object.getOwnPropertyDescriptor(Location.prototype, 'search') || null;
  try {
    Object.defineProperty(location, 'search', {
      configurable: true,
      get() { return params.toString() ? ('?' + params.toString()) : ''; }
    });
  } catch (e) {}
  setTimeout(() => {
    const fn = _initMap[route];
    if (fn) try { fn(); } catch (e) { console.error('init error', e); }
    // restore
    try { delete location.search; } catch (e) {}
  }, 20);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', showRoute);
document.addEventListener('DOMContentLoaded', () => {
  initPageEnter();
  showRoute();
});
