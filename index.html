<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>PetTI · 给你家小祖宗建一份精神档案</title>
<meta name="description" content="PetTI · 宠物行为人格鉴定实验室。基于日常行为观察，从 6 个维度生成又准又离谱的宠物行为档案。" />
<meta name="theme-color" content="#EFE8DA" />
<meta property="og:title" content="PetTI · 给你家小祖宗建一份精神档案" />
<meta property="og:description" content="鉴定一下，你家小祖宗是哪种小祖宗。" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://cdn.staticfile.org/twemoji/14.0.2/svg/1f63c.svg" />
<link rel="icon" type="image/svg+xml" href="https://cdn.staticfile.org/twemoji/14.0.2/svg/1f43e.svg" />
<link rel="preconnect" href="https://cdn.staticfile.org" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<style>
/* =========================================================
   PetTI — Pet Personality Lab
   Design System
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

/* ---------- Tokens ---------- */
:root {
  --paper:   #EFE8DA;
  --paper-2: #E5DDCB;
  --cream:   #F4EFE3;
  --ink:     #14130F;
  --ash:     #6B6659;
  --rule:    #2A2823;
  --mark:    #C8351A;
  --stamp:   #B23A1F;
  --accent:  #E8C547;
  --line:    rgba(20,19,15,0.14);

  --cat-bg:     #14102A;
  --cat-ink:    #ECE6FF;
  --cat-accent: #B39AFF;
  --cat-glow:   #4ED8FF;

  --dog-bg:     #1A1F12;
  --dog-ink:    #EDEFE0;
  --dog-accent: #C7E04A;
  --dog-warm:   #E8823A;

  --serif: 'Instrument Serif', 'Noto Serif SC', 'Times New Roman', serif;
  --sans:  'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  --mono:  'JetBrains Mono', 'Courier New', monospace;

  --pad: clamp(20px, 4vw, 56px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* Paper grain overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.35;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 0.08 0 0 0 0 0.07 0 0 0 0 0.05 0 0 0 0.5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

::selection { background: var(--ink); color: var(--paper); }

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
img { display: block; max-width: 100%; }

/* ---------- Typography ---------- */
.serif { font-family: var(--serif); }
.sans  { font-family: var(--sans); }
.mono  { font-family: var(--mono); }
.it    { font-style: italic; }

.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ash);
}

.label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ash);
}

h1,h2,h3,h4 { font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; }

/* ---------- Layout primitives ---------- */
.page {
  position: relative;
  min-height: 100vh;
  padding: var(--pad);
  z-index: 2;
}

.container { max-width: 1440px; margin: 0 auto; position: relative; }

.rule { height: 1px; background: var(--rule); width: 100%; }
.rule-thin { height: 1px; background: var(--line); width: 100%; }

/* ---------- Top bar / nav ---------- */
.topbar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 32px;
  align-items: center;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--rule);
  position: relative;
  z-index: 5;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.brand .logo {
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  letter-spacing: -0.02em;
  text-transform: none;
  color: var(--ink);
}
.brand .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--mark);
  display: inline-block;
  margin: 0 2px;
}

.nav-meta {
  display: flex;
  justify-content: center;
  gap: 28px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ash);
}
.nav-meta a { transition: color .2s; position: relative; }
.nav-meta a:hover { color: var(--ink); }
.nav-meta a::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: -4px;
  height: 1px; background: var(--ink);
  transform: scaleX(0); transform-origin: left;
  transition: transform .3s;
}
.nav-meta a:hover::after { transform: scaleX(1); }
.nav-meta a.active { color: var(--ink); }
.nav-meta a.active::after { transform: scaleX(1); }

.topbar-right {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ash);
  text-align: right;
}
.topbar-right .id {
  display: block;
  color: var(--ink);
  margin-bottom: 2px;
}

/* ---------- Footer ---------- */
.bottombar {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 24px;
  padding-top: 22px;
  margin-top: 64px;
  border-top: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ash);
}
.bottombar .center { text-align: center; }
.bottombar .right { text-align: right; }

/* ---------- Hero ---------- */
.hero {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0;
  padding-top: clamp(28px, 6vw, 80px);
  padding-bottom: clamp(40px, 8vw, 120px);
  position: relative;
}

.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.9fr);
  gap: clamp(24px, 4vw, 64px);
  align-items: end;
}

.hero-headline {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(56px, 11vw, 168px);
  line-height: 0.92;
  letter-spacing: -0.035em;
  color: var(--ink);
}
.hero-headline .it {
  font-style: italic;
  color: var(--mark);
}
.hero-headline .small {
  font-size: 0.5em;
  display: block;
  margin-top: 0.2em;
  letter-spacing: -0.02em;
}

.hero-sub {
  max-width: 480px;
  margin-top: 36px;
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
}
.hero-sub strong { font-weight: 700; }

.hero-meta-grid {
  display: grid;
  grid-template-columns: max-content 1fr;
  column-gap: 24px;
  row-gap: 8px;
  margin-top: 28px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.hero-meta-grid dt { color: var(--ash); }
.hero-meta-grid dd { color: var(--ink); }

/* ---------- Specimen card (floating archive card) ---------- */
.specimen {
  position: relative;
  background: var(--cream);
  border: 1px solid var(--rule);
  padding: 24px;
  min-height: 460px;
  transform: rotate(-2.3deg);
  box-shadow:
    0 1px 0 var(--rule),
    0 28px 60px -28px rgba(20,19,15,0.45),
    0 8px 22px -16px rgba(20,19,15,0.25);
  transition: transform .5s cubic-bezier(.2,.8,.2,1);
}
.specimen:hover { transform: rotate(-0.6deg) translateY(-4px); }

.specimen::before {
  /* perforation top */
  content: '';
  position: absolute;
  left: 0; right: 0; top: 18px;
  border-top: 1px dashed var(--rule);
}

.specimen-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ash);
  padding-top: 14px;
}

.specimen-title {
  font-family: var(--serif);
  font-size: 38px;
  line-height: 1;
  letter-spacing: -0.02em;
  margin-top: 22px;
}
.specimen-title .it { font-style: italic; color: var(--mark); }

.specimen-photo {
  margin-top: 18px;
  aspect-ratio: 1;
  border: 1px solid var(--rule);
  position: relative;
  overflow: hidden;
  background: var(--paper);
}
.specimen-photo svg { width: 100%; height: 100%; display: block; }

.specimen-rows {
  margin-top: 18px;
  display: grid;
  grid-template-columns: max-content 1fr;
  row-gap: 6px;
  column-gap: 14px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.specimen-rows dt { color: var(--ash); }
.specimen-rows dd { color: var(--ink); }
.specimen-rows dd.warn { color: var(--mark); font-weight: 600; }

.stamp {
  position: absolute;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--stamp);
  border: 2px solid var(--stamp);
  padding: 8px 14px;
  border-radius: 4px;
  transform: rotate(-12deg);
  opacity: 0.86;
  background: rgba(178, 58, 31, 0.03);
}
.stamp.tr { top: 32px; right: -10px; }
.stamp.br { bottom: 24px; right: -10px; transform: rotate(8deg); }
.stamp.bl { bottom: 24px; left: -8px; transform: rotate(-6deg); }

/* corner crop marks */
.crop {
  position: absolute;
  width: 14px; height: 14px;
}
.crop::before, .crop::after {
  content: '';
  position: absolute;
  background: var(--rule);
}
.crop::before { left: 0; top: 6px; width: 14px; height: 1px; }
.crop::after  { top: 0; left: 6px; width: 1px; height: 14px; }
.crop.tl { top: -22px; left: -22px; }
.crop.tr { top: -22px; right: -22px; }
.crop.bl { bottom: -22px; left: -22px; }
.crop.br { bottom: -22px; right: -22px; }

/* ---------- Marquee ---------- */
.marquee {
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 14px 0;
  overflow: hidden;
  white-space: nowrap;
  margin-top: 36px;
  position: relative;
}
.marquee-track {
  display: inline-flex;
  gap: 48px;
  animation: marquee 38s linear infinite;
  font-family: var(--serif);
  font-style: italic;
  font-size: 26px;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.marquee-track span { display: inline-flex; align-items: center; gap: 12px; }
.marquee-track .mono {
  font-family: var(--mono);
  font-style: normal;
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--mark);
  text-transform: uppercase;
}
.marquee-track .star { color: var(--mark); }
@keyframes marquee {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* ---------- CTA buttons ---------- */
.cta-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 48px;
  max-width: 720px;
}

.cta {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  gap: 12px;
  padding: 22px 24px;
  background: var(--ink);
  color: var(--paper);
  border: 1px solid var(--ink);
  transition: all .25s;
  position: relative;
  overflow: hidden;
}
.cta:hover {
  background: var(--mark);
  border-color: var(--mark);
  transform: translateY(-2px);
}
.cta .cta-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  opacity: 0.6;
  margin-bottom: 8px;
}
.cta .cta-title {
  font-family: var(--serif);
  font-size: 30px;
  line-height: 1;
}
.cta .cta-title .it { font-style: italic; }
.cta .arrow {
  font-family: var(--serif);
  font-size: 38px;
  line-height: 0.8;
}
.cta.alt {
  background: transparent;
  color: var(--ink);
  border-color: var(--ink);
}
.cta.alt:hover {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

/* ---------- Sections ---------- */
.section {
  padding-top: clamp(48px, 8vw, 120px);
  padding-bottom: clamp(48px, 8vw, 120px);
  position: relative;
}
.section-head {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 24px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 48px;
  align-items: end;
}
.section-head .num {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--ash);
}
.section-head h2 {
  font-family: var(--serif);
  font-size: clamp(36px, 6vw, 72px);
  letter-spacing: -0.02em;
  line-height: 0.95;
}
.section-head h2 .it { font-style: italic; color: var(--mark); }

/* ---------- Method 3-column ---------- */
.method-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
}
.method-card {
  border: 1px solid var(--rule);
  background: var(--cream);
  padding: 28px;
  position: relative;
  min-height: 320px;
}
.method-card .step {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--mark);
  text-transform: uppercase;
  margin-bottom: 18px;
}
.method-card h3 {
  font-family: var(--serif);
  font-size: 36px;
  line-height: 1;
  margin-bottom: 14px;
}
.method-card h3 .it { font-style: italic; }
.method-card p {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.55;
}
.method-card .num-big {
  position: absolute;
  top: 18px; right: 22px;
  font-family: var(--serif);
  font-size: 64px;
  font-style: italic;
  color: var(--paper-2);
  line-height: 1;
}

/* ---------- Persona grid (Dex) ---------- */
.persona-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-top: 1px solid var(--rule);
  border-left: 1px solid var(--rule);
}
.persona-card {
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 24px 22px 28px;
  background: var(--paper);
  position: relative;
  min-height: 260px;
  transition: background .25s;
  cursor: pointer;
}
.persona-card:hover { background: var(--cream); }
.persona-card .pno {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--ash);
}
.persona-card .pcode {
  font-family: var(--serif);
  font-size: 44px;
  line-height: 1;
  margin: 14px 0 6px;
  letter-spacing: -0.02em;
}
.persona-card .pcode .it { font-style: italic; color: var(--mark); }
.persona-card .pname {
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  color: var(--ink);
  margin-bottom: 14px;
}
.persona-card .ptag {
  font-size: 13px;
  color: var(--ash);
  line-height: 1.45;
}
.persona-card .quote {
  position: absolute;
  bottom: 18px;
  left: 22px; right: 22px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: var(--mark);
  opacity: 0;
  transition: opacity .25s;
}
.persona-card:hover .quote { opacity: 1; }
.persona-card:hover .ptag { opacity: 0.5; }

.dex-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--rule);
}
.dex-tab {
  padding: 14px 24px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ash);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all .2s;
}
.dex-tab.active {
  color: var(--ink);
  border-bottom-color: var(--mark);
}
.dex-tab:hover { color: var(--ink); }

/* ---------- Selector page ---------- */
.select-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-top: 64px;
}
.select-card {
  border: 1px solid var(--rule);
  background: var(--cream);
  padding: 40px 36px;
  min-height: 540px;
  position: relative;
  cursor: pointer;
  transition: all .3s;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.select-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 30px 60px -30px rgba(20,19,15,0.4);
}
.select-card.cat:hover { background: #1A1530; color: var(--cat-ink); border-color: var(--cat-accent); }
.select-card.dog:hover { background: #1F2418; color: var(--dog-ink); border-color: var(--dog-accent); }
.select-card.cat:hover .label,
.select-card.dog:hover .label { color: rgba(255,255,255,0.5); }
.select-card.cat:hover .arr { color: var(--cat-accent); }
.select-card.dog:hover .arr { color: var(--dog-accent); }

.select-card .num {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.2em;
}
.select-card .title {
  font-family: var(--serif);
  font-size: 120px;
  line-height: 0.85;
  letter-spacing: -0.04em;
  margin: 24px 0 8px;
}
.select-card .title .it { font-style: italic; color: var(--mark); }
.select-card .subtitle {
  font-family: var(--serif);
  font-style: italic;
  font-size: 28px;
  color: var(--ash);
}
.select-card .dims {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--ash);
  text-transform: uppercase;
  line-height: 1.9;
  margin-top: 28px;
}
.select-card .arr {
  position: absolute;
  bottom: 36px; right: 36px;
  font-family: var(--serif);
  font-size: 56px;
  font-style: italic;
  line-height: 0.8;
  transition: transform .3s;
}
.select-card:hover .arr { transform: translateX(8px); }

/* ---------- Info form ---------- */
.form-shell {
  max-width: 720px;
  margin: 64px auto;
}
.form-row {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 32px;
  padding: 22px 0;
  border-bottom: 1px solid var(--line);
  align-items: center;
}
.form-row label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ash);
}
.form-row input, .form-row select {
  font-family: var(--serif);
  font-size: 28px;
  background: transparent;
  border: none;
  outline: none;
  color: var(--ink);
  width: 100%;
  padding: 6px 0;
  font-style: italic;
}
.form-row input::placeholder { color: var(--paper-2); font-style: italic; }
.form-row .chip-row { display: flex; gap: 10px; flex-wrap: wrap; }
.chip {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 8px 14px;
  border: 1px solid var(--rule);
  cursor: pointer;
  transition: all .2s;
}
.chip:hover { background: var(--ink); color: var(--paper); }
.chip.on { background: var(--ink); color: var(--paper); }

/* ---------- Quiz ---------- */
.quiz-shell {
  max-width: 900px;
  margin: 0 auto;
  padding-top: 36px;
}
.quiz-progress {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 18px;
  align-items: center;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ash);
  margin-bottom: 56px;
}
.quiz-progress .bar {
  height: 1px;
  background: var(--line);
  position: relative;
}
.quiz-progress .bar::after {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: var(--ink);
  width: var(--p, 0%);
  transition: width .4s cubic-bezier(.2,.8,.2,1);
}

.q-num {
  font-family: var(--serif);
  font-style: italic;
  font-size: 24px;
  color: var(--mark);
  margin-bottom: 16px;
}
.q-text {
  font-family: var(--serif);
  font-size: clamp(34px, 5vw, 58px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 48px;
  max-width: 18ch;
}

.options { display: grid; gap: 12px; }
.opt {
  display: grid;
  grid-template-columns: 36px 1fr auto;
  align-items: center;
  gap: 18px;
  padding: 22px 24px;
  background: var(--cream);
  border: 1px solid var(--rule);
  text-align: left;
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.4;
  transition: all .2s;
  cursor: pointer;
}
.opt:hover {
  background: var(--ink);
  color: var(--paper);
  transform: translateX(4px);
}
.opt .letter {
  font-family: var(--serif);
  font-style: italic;
  font-size: 28px;
  color: var(--mark);
}
.opt:hover .letter { color: var(--accent); }
.opt .plus {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--ash);
  opacity: 0;
  transition: opacity .2s;
}
.opt:hover .plus { opacity: 1; color: var(--paper); }

.quiz-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 48px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ash);
}
.quiz-nav button { color: var(--ink); }
.quiz-nav button:disabled { color: var(--paper-2); cursor: not-allowed; }

/* ---------- Analyzing screen ---------- */
.analyzing {
  min-height: 80vh;
  display: grid;
  place-items: center;
}
.analyzing-inner { text-align: center; max-width: 600px; }
.analyzing-inner .big {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(48px, 8vw, 96px);
  letter-spacing: -0.02em;
  line-height: 1;
  margin-bottom: 36px;
}
.analyzing-inner .scroll-lines {
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ash);
  text-align: left;
  display: inline-block;
}
.analyzing-inner .scroll-lines div {
  padding: 4px 0;
  opacity: 0;
  animation: fadeIn .4s forwards;
}
@keyframes fadeIn { to { opacity: 1; } }

/* ---------- Result page ---------- */
.result-doc {
  margin-top: 32px;
  border: 1px solid var(--rule);
  background: var(--cream);
  padding: clamp(28px, 4vw, 64px);
  position: relative;
}
.result-meta {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ash);
  padding-bottom: 20px;
  border-bottom: 1px solid var(--rule);
}
.result-meta .v { color: var(--ink); display: block; margin-top: 4px; font-size: 12px; }

.result-headline {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 48px;
  align-items: end;
  padding: 56px 0 48px;
  border-bottom: 1px solid var(--rule);
}
.result-headline .left .eyebrow { margin-bottom: 18px; }
.result-headline .code {
  font-family: var(--serif);
  font-size: clamp(80px, 14vw, 200px);
  line-height: 0.85;
  letter-spacing: -0.04em;
}
.result-headline .code .it { font-style: italic; color: var(--mark); }
.result-headline .pname {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(28px, 4vw, 48px);
  margin-top: 16px;
  letter-spacing: -0.01em;
}
.result-headline .quote {
  font-family: var(--serif);
  font-style: italic;
  font-size: 24px;
  line-height: 1.3;
  color: var(--ink);
  border-left: 2px solid var(--mark);
  padding-left: 20px;
  margin-bottom: 16px;
}
.result-headline .match {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ash);
}
.result-headline .match strong { color: var(--mark); font-size: 24px; font-family: var(--serif); font-style: italic; }

.result-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  padding-top: 48px;
}
.r-block {
  padding-bottom: 32px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 32px;
}
.r-block:last-child { border-bottom: none; }
.r-block h4 {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mark);
  margin-bottom: 18px;
}
.r-block p, .r-block li {
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.55;
  color: var(--ink);
}
.r-block ol { padding-left: 0; counter-reset: r; list-style: none; }
.r-block ol li {
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 12px;
  margin-bottom: 14px;
  counter-increment: r;
}
.r-block ol li::before {
  content: counter(r, decimal-leading-zero);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--mark);
  padding-top: 6px;
}
.r-block .sub-quote {
  font-style: italic;
  color: var(--ash);
  font-size: 17px;
}

/* Radar */
.radar-wrap {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 36px;
  align-items: center;
}
.radar { width: 100%; height: auto; }
.radar polygon.grid { fill: none; stroke: var(--line); }
.radar polygon.data { fill: rgba(200,53,26,0.12); stroke: var(--mark); stroke-width: 1.5; }
.radar circle.dot { fill: var(--mark); }
.radar text { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; fill: var(--ash); text-transform: uppercase; }
.radar line { stroke: var(--line); }

.dim-list { display: grid; gap: 14px; }
.dim-row {
  display: grid;
  grid-template-columns: 80px 1fr 40px;
  gap: 12px;
  align-items: center;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.dim-row .bar {
  height: 6px;
  background: var(--paper-2);
  position: relative;
  border: 1px solid var(--rule);
}
.dim-row .bar::after {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: var(--ink);
  width: var(--w, 0%);
}
.dim-row .val { text-align: right; font-weight: 600; color: var(--ink); }

/* Sub persona block */
.sub-persona {
  background: var(--ink);
  color: var(--paper);
  padding: 28px 32px;
  margin-top: 16px;
}
.sub-persona .eyebrow { color: rgba(255,255,255,0.55); margin-bottom: 14px; }
.sub-persona .code-line {
  font-family: var(--serif);
  font-style: italic;
  font-size: 36px;
  line-height: 1;
  margin-bottom: 8px;
}
.sub-persona .code-line strong { font-style: normal; color: var(--accent); margin-right: 8px; }
.sub-persona p {
  font-family: var(--serif);
  font-size: 17px;
  color: rgba(255,255,255,0.85);
  line-height: 1.5;
}

/* Share cards */
.share-section {
  margin-top: 64px;
  padding-top: 48px;
  border-top: 1px solid var(--rule);
}
.share-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 32px;
}
.share-card {
  aspect-ratio: 3 / 4;
  border: 1px solid var(--rule);
  padding: 22px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: transform .3s;
}
.share-card:hover { transform: translateY(-4px); }

.share-card.id-card {
  background: var(--cream);
  display: grid;
  grid-template-rows: auto 1fr auto;
}
.share-card.id-card .head {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ash);
  display: flex;
  justify-content: space-between;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--rule);
}
.share-card.id-card .body {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
}
.share-card.id-card .body .pcode {
  font-family: var(--serif);
  font-size: 56px;
  font-style: italic;
  color: var(--mark);
  line-height: 1;
}
.share-card.id-card .body .pname {
  font-family: var(--serif);
  font-size: 18px;
  margin-top: 6px;
}
.share-card.id-card .foot {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ash);
  text-align: center;
  padding-top: 12px;
  border-top: 1px solid var(--rule);
}

.share-card.wanted {
  background: #D9C99A;
  color: #1A140A;
}
.share-card.wanted .wtop {
  text-align: center;
  font-family: var(--serif);
  font-size: 48px;
  font-style: italic;
  line-height: 1;
  border-bottom: 2px solid #1A140A;
  padding-bottom: 12px;
}
.share-card.wanted .wbody {
  margin-top: 18px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  line-height: 1.7;
}
.share-card.wanted .wbody .pcode {
  font-family: var(--serif);
  font-style: italic;
  font-size: 28px;
  text-transform: none;
  margin: 14px 0;
  letter-spacing: 0;
}

.share-card.report {
  background: var(--ink);
  color: var(--paper);
}
.share-card.report .rtop {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  opacity: 0.6;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}
.share-card.report .rtitle {
  font-family: var(--serif);
  font-style: italic;
  font-size: 32px;
  margin: 20px 0 14px;
}
.share-card.report .rtitle strong { color: var(--accent); font-style: normal; }
.share-card.report .rdims {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  line-height: 1.9;
  opacity: 0.85;
}

.share-foot {
  margin-top: 28px;
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ash);
}
.share-foot button { color: var(--ink); border-bottom: 1px solid var(--ink); padding-bottom: 2px; }

/* ---------- About ---------- */
.about-hero {
  padding: 80px 0 48px;
  border-bottom: 1px solid var(--rule);
}
.about-hero h1 {
  font-family: var(--serif);
  font-size: clamp(56px, 10vw, 144px);
  letter-spacing: -0.03em;
  line-height: 0.95;
}
.about-hero h1 .it { font-style: italic; color: var(--mark); }

.about-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  margin-top: 64px;
}
.about-col p {
  font-family: var(--serif);
  font-size: 20px;
  line-height: 1.55;
  margin-bottom: 24px;
}
.about-col .pull {
  font-family: var(--serif);
  font-style: italic;
  font-size: 32px;
  line-height: 1.2;
  color: var(--mark);
  padding: 24px 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  margin: 32px 0;
}

.dict {
  margin-top: 80px;
}
.dict h2 {
  font-family: var(--serif);
  font-size: clamp(36px, 6vw, 64px);
  margin-bottom: 32px;
}
.dict h2 .it { font-style: italic; color: var(--mark); }
.dict-grid {
  display: grid;
  grid-template-columns: 200px 1fr;
  row-gap: 22px;
  column-gap: 32px;
}
.dict-grid dt {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mark);
  padding-top: 4px;
}
.dict-grid dd {
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.5;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--line);
}

/* ---------- Modal (persona detail) ---------- */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(20,19,15,0.8);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-bg.on { display: flex; }
.modal {
  background: var(--paper);
  max-width: 720px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 48px;
  position: relative;
  border: 1px solid var(--rule);
}
.modal .close {
  position: absolute;
  top: 18px; right: 24px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.modal .mcode {
  font-family: var(--serif);
  font-size: 72px;
  font-style: italic;
  color: var(--mark);
  line-height: 1;
}
.modal .mname {
  font-family: var(--serif);
  font-size: 28px;
  margin: 8px 0 4px;
}
.modal .mtag {
  color: var(--ash);
  font-style: italic;
  font-family: var(--serif);
  margin-bottom: 24px;
}
.modal .msection { padding: 20px 0; border-top: 1px solid var(--line); }
.modal .msection h5 {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--mark);
  margin-bottom: 10px;
}
.modal .msection p, .modal .msection li {
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.55;
}
.modal .msection ol { padding-left: 20px; }

/* =========================================================
   v2 — ADDED: Animations, Fluidity, New Components
   ========================================================= */

/* ---------- Word cycle in hero ---------- */
.hero-headline [data-cycle] {
  display: inline-block;
  position: relative;
  min-width: 5ch;
  transition: transform .5s cubic-bezier(.2,.8,.2,1);
}
.hero-headline [data-cycle].swap {
  animation: cycleSwap .8s cubic-bezier(.2,.8,.2,1);
}
@keyframes cycleSwap {
  0%   { transform: translateY(0) rotateX(0); opacity: 1; }
  40%  { transform: translateY(-30%) rotateX(45deg); opacity: 0; }
  60%  { transform: translateY(30%) rotateX(-45deg); opacity: 0; }
  100% { transform: translateY(0) rotateX(0); opacity: 1; }
}

/* ---------- Scroll reveal ---------- */
.reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity .9s cubic-bezier(.2,.8,.2,1), transform .9s cubic-bezier(.2,.8,.2,1);
  transition-delay: var(--d, 0s);
}
.reveal.on { opacity: 1; transform: translateY(0); }

.reveal-stagger > * {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1);
}
.reveal-stagger.on > *:nth-child(1) { opacity:1; transform:none; transition-delay: 0s; }
.reveal-stagger.on > *:nth-child(2) { opacity:1; transform:none; transition-delay: .08s; }
.reveal-stagger.on > *:nth-child(3) { opacity:1; transform:none; transition-delay: .16s; }
.reveal-stagger.on > *:nth-child(4) { opacity:1; transform:none; transition-delay: .24s; }
.reveal-stagger.on > *:nth-child(5) { opacity:1; transform:none; transition-delay: .32s; }
.reveal-stagger.on > *:nth-child(6) { opacity:1; transform:none; transition-delay: .40s; }
.reveal-stagger.on > *:nth-child(7) { opacity:1; transform:none; transition-delay: .48s; }
.reveal-stagger.on > *:nth-child(8) { opacity:1; transform:none; transition-delay: .56s; }

/* ---------- Topbar scroll-compact ---------- */
.topbar.compact {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 14px var(--pad);
  background: rgba(239,232,218,0.88);
  backdrop-filter: blur(14px) saturate(1.1);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  border-bottom: 1px solid var(--rule);
  z-index: 50;
  animation: dropIn .4s cubic-bezier(.2,.8,.2,1);
}
@keyframes dropIn {
  from { transform: translateY(-100%); }
  to { transform: translateY(0); }
}

/* ---------- Magnetic / hover lift ---------- */
.lift { transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; }
.lift:hover { transform: translateY(-4px); }

/* ---------- Mouse parallax wrapper ---------- */
.parallax {
  transition: transform .6s cubic-bezier(.2,.8,.2,1);
  will-change: transform;
}

/* ---------- Hero subtitle cycling ---------- */
.subtitle-cycle {
  display: inline-block;
  position: relative;
  color: var(--mark);
  font-style: italic;
}
.subtitle-cycle .word {
  display: inline-block;
  position: absolute;
  left: 0;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .5s, transform .5s;
  white-space: nowrap;
}
.subtitle-cycle .word.on {
  opacity: 1;
  transform: translateY(0);
  position: relative;
}

/* ---------- Live counter (topbar + footer) ---------- */
.live-counter {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ash);
}
.live-counter::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--mark);
  display: inline-block;
  animation: pulse 1.6s ease-in-out infinite;
}
.live-counter strong {
  color: var(--ink);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
@keyframes pulse {
  0%, 100% { opacity: 0.4; transform: scale(0.85); }
  50%      { opacity: 1; transform: scale(1.1); }
}

/* ---------- Ranking section ---------- */
.ranking-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  margin-top: 32px;
}
.rank-card {
  position: relative;
  border: 1px solid var(--rule);
  background: var(--cream);
  padding: 32px 28px;
  overflow: hidden;
  transition: all .4s cubic-bezier(.2,.8,.2,1);
  cursor: pointer;
}
.rank-card:hover {
  background: var(--ink);
  color: var(--paper);
  transform: translateY(-6px);
}
.rank-card:hover .rmeta { color: rgba(255,255,255,0.5); }
.rank-card:hover .rcode .it { color: var(--accent); }
.rank-card:hover .rpct { color: var(--accent); }
.rank-card .rnum {
  position: absolute;
  top: 18px; right: 22px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 96px;
  line-height: 0.8;
  color: var(--paper-2);
  transition: color .4s;
}
.rank-card:hover .rnum { color: rgba(255,255,255,0.08); }
.rank-card .rmeta {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ash);
}
.rank-card .rcode {
  font-family: var(--serif);
  font-size: 52px;
  line-height: 1;
  margin: 28px 0 10px;
  letter-spacing: -0.02em;
}
.rank-card .rcode .it { font-style: italic; color: var(--mark); transition: color .4s; }
.rank-card .rname {
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  margin-bottom: 20px;
}
.rank-card .rpct {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--mark);
  margin-bottom: 18px;
  transition: color .4s;
}
.rank-card .rpct strong {
  font-family: var(--serif);
  font-style: italic;
  font-size: 28px;
  margin-right: 6px;
}
.rank-card .rbar {
  height: 2px;
  background: var(--paper-2);
  position: relative;
}
.rank-card .rbar::after {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  background: var(--mark);
  width: var(--w, 0%);
  transition: width 1.2s cubic-bezier(.2,.8,.2,1) .3s;
}

/* ---------- Random discover ---------- */
.discover-strip {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 32px;
  align-items: center;
  padding: 36px;
  border: 1px solid var(--rule);
  background: var(--ink);
  color: var(--paper);
  margin-top: 32px;
  position: relative;
  overflow: hidden;
}
.discover-strip::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(135deg, transparent 0 28px, rgba(255,255,255,0.025) 28px 56px);
  pointer-events: none;
}
.discover-strip h3 {
  font-family: var(--serif);
  font-size: clamp(28px, 4vw, 48px);
  letter-spacing: -0.01em;
  line-height: 1.05;
  position: relative;
}
.discover-strip h3 .it { font-style: italic; color: var(--accent); }
.discover-strip p {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
  margin-top: 10px;
  position: relative;
}
.discover-btn {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  background: var(--accent);
  color: var(--ink);
  padding: 18px 28px;
  border: none;
  position: relative;
  transition: transform .25s, background .25s;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.discover-btn:hover { transform: scale(1.04); background: #FFD555; }
.discover-btn::after {
  content: '↗';
  font-family: var(--serif);
  font-style: italic;
  font-size: 18px;
}

/* ---------- Info page (pet input) ---------- */
.info-shell {
  max-width: 720px;
  margin: 80px auto 40px;
}
.info-title {
  font-family: var(--serif);
  font-size: clamp(48px, 8vw, 88px);
  line-height: 0.95;
  letter-spacing: -0.03em;
  margin-bottom: 14px;
}
.info-title .it { font-style: italic; color: var(--mark); }
.info-sub {
  font-family: var(--serif);
  font-style: italic;
  font-size: 20px;
  color: var(--ash);
  margin-bottom: 56px;
}
.info-field {
  border-bottom: 1px solid var(--rule);
  padding: 24px 0;
  position: relative;
}
.info-field .lbl {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ash);
  margin-bottom: 10px;
  display: block;
}
.info-field input {
  background: transparent;
  border: none;
  outline: none;
  width: 100%;
  font-family: var(--serif);
  font-size: 36px;
  font-style: italic;
  color: var(--ink);
  padding: 4px 0;
}
.info-field input::placeholder { color: var(--paper-2); }
.info-field .hint {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--ash);
  text-transform: uppercase;
  margin-top: 8px;
}
.info-chips {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}
.info-chip {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 10px 16px;
  border: 1px solid var(--rule);
  background: transparent;
  cursor: pointer;
  transition: all .2s;
}
.info-chip:hover { background: var(--paper-2); }
.info-chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.info-submit {
  margin-top: 56px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
}
.btn-primary {
  background: var(--ink);
  color: var(--paper);
  padding: 22px 32px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 14px;
  transition: all .25s;
  position: relative;
  overflow: hidden;
}
.btn-primary:hover { background: var(--mark); transform: translateY(-2px); }
.btn-primary .arr {
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  transition: transform .25s;
}
.btn-primary:hover .arr { transform: translateX(6px); }

/* ---------- Question slide animation ---------- */
.q-text.slide-in {
  animation: qSlideIn .5s cubic-bezier(.2,.8,.2,1);
}
.opt.slide-in {
  animation: oSlideIn .5s cubic-bezier(.2,.8,.2,1) both;
}
.opt.slide-in:nth-child(1) { animation-delay: .05s; }
.opt.slide-in:nth-child(2) { animation-delay: .12s; }
.opt.slide-in:nth-child(3) { animation-delay: .19s; }
.opt.slide-in:nth-child(4) { animation-delay: .26s; }
@keyframes qSlideIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes oSlideIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}
.q-text.slide-out, .opt.slide-out {
  opacity: 0;
  transform: translateY(-12px);
  transition: opacity .25s, transform .25s;
}

/* ---------- Result stamp drop ---------- */
.stamp-impact {
  position: absolute;
  top: 36px;
  right: -8px;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--stamp);
  border: 2px solid var(--stamp);
  padding: 10px 18px;
  background: rgba(178, 58, 31, 0.04);
  transform: rotate(-12deg) scale(2.5);
  opacity: 0;
  animation: stampDrop 1.2s cubic-bezier(.4,1.6,.5,1) .4s forwards;
  pointer-events: none;
  z-index: 5;
}
@keyframes stampDrop {
  0%   { transform: rotate(0) scale(3.4); opacity: 0; }
  60%  { transform: rotate(-12deg) scale(0.92); opacity: 0.95; }
  72%  { transform: rotate(-12deg) scale(1.04); opacity: 1; }
  100% { transform: rotate(-12deg) scale(1); opacity: 0.86; }
}

/* ---------- Match count-up ---------- */
.match-big {
  font-family: var(--serif);
  font-style: italic;
  font-size: 56px;
  line-height: 1;
  color: var(--mark);
  font-variant-numeric: tabular-nums;
  display: inline-block;
  letter-spacing: -0.02em;
}

/* ---------- Marquee hover slow ---------- */
.marquee:hover .marquee-track {
  animation-duration: 80s;
}
.marquee-track { transition: animation-duration .3s; }

/* ---------- Hero word cycle (subtitle alt) ---------- */
.word-cycle {
  display: inline-block;
  position: relative;
  font-style: italic;
  color: var(--mark);
}
.word-cycle .w {
  display: inline-block;
  opacity: 0;
  transform: translateY(60%);
  position: absolute;
  left: 0;
  white-space: nowrap;
  transition: opacity .45s cubic-bezier(.2,.8,.2,1), transform .45s cubic-bezier(.2,.8,.2,1);
}
.word-cycle .w.on {
  opacity: 1;
  transform: translateY(0);
  position: relative;
}
.word-cycle .w.out {
  opacity: 0;
  transform: translateY(-60%);
}

/* ---------- Couple page ---------- */
.couple-shell {
  max-width: 900px;
  margin: 56px auto;
}
.couple-intro {
  text-align: center;
  padding: 48px 0 64px;
  border-bottom: 1px solid var(--rule);
}
.couple-intro .eyebrow { margin-bottom: 20px; }
.couple-intro h1 {
  font-family: var(--serif);
  font-size: clamp(48px, 9vw, 120px);
  letter-spacing: -0.03em;
  line-height: 0.95;
}
.couple-intro h1 .it { font-style: italic; color: var(--mark); }
.couple-intro p {
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  color: var(--ash);
  margin-top: 24px;
  max-width: 520px;
  margin-left: auto;
  margin-right: auto;
}

.couple-result {
  text-align: center;
  padding: 64px 0;
}
.couple-result .label-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
  margin-bottom: 36px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ash);
}
.couple-result .pct-big {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(120px, 24vw, 320px);
  line-height: 0.9;
  letter-spacing: -0.04em;
  color: var(--mark);
  font-variant-numeric: tabular-nums;
}
.couple-result .verdict {
  font-family: var(--serif);
  font-size: clamp(24px, 3.5vw, 38px);
  line-height: 1.3;
  max-width: 700px;
  margin: 32px auto 0;
}
.couple-result .verdict .it { font-style: italic; color: var(--mark); }

/* ---------- Dex search ---------- */
.dex-search {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 20px;
  margin-bottom: 24px;
  align-items: center;
}
.dex-search input {
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--rule);
  outline: none;
  padding: 12px 0;
  font-family: var(--serif);
  font-size: 22px;
  font-style: italic;
  color: var(--ink);
  width: 100%;
}
.dex-search input::placeholder { color: var(--paper-2); }
.dex-count {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ash);
}
.persona-card.hidden { display: none; }

/* ---------- Modal animation ---------- */
.modal-bg {
  opacity: 0;
  transition: opacity .3s;
}
.modal-bg.on { opacity: 1; }
.modal {
  transform: translateY(20px) scale(0.97);
  transition: transform .4s cubic-bezier(.2,.8,.2,1);
}
.modal-bg.on .modal { transform: translateY(0) scale(1); }

/* ---------- Page transition overlay ---------- */
.page-transition {
  position: fixed;
  inset: 0;
  background: var(--ink);
  z-index: 200;
  transform: translateY(100%);
  pointer-events: none;
}
.page-transition.in {
  transform: translateY(0);
  transition: transform .55s cubic-bezier(.7,0,.3,1);
}
.page-transition.out {
  transform: translateY(-100%);
  transition: transform .55s cubic-bezier(.7,0,.3,1);
}

/* ---------- Tooltip ---------- */
.tip-wrap { position: relative; display: inline-block; }
.tip-wrap .tip {
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--paper);
  padding: 6px 10px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
}
.tip-wrap:hover .tip { opacity: 1; transform: translateX(-50%) translateY(-2px); }

/* ---------- Match meter ---------- */
.match-meter {
  position: relative;
  display: inline-grid;
  grid-template-columns: auto auto;
  align-items: baseline;
  gap: 6px;
}
.match-meter .lbl {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ash);
}

/* ---------- Ticker (sub-ticker under hero) ---------- */
.ticker-row {
  display: flex;
  gap: 32px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 28px;
  padding: 16px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ash);
}
.ticker-row .stat strong {
  color: var(--ink);
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  margin-right: 6px;
  font-variant-numeric: tabular-nums;
}

/* ---------- Section number large ---------- */
.section-folio {
  position: absolute;
  top: 0; right: 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(120px, 18vw, 280px);
  color: var(--paper-2);
  line-height: 0.8;
  pointer-events: none;
  user-select: none;
  z-index: 0;
}
.section { position: relative; }
.section > * { position: relative; z-index: 1; }

/* ---------- Floating badge ---------- */
.floating-badge {
  position: fixed;
  right: 24px;
  bottom: 24px;
  background: var(--ink);
  color: var(--paper);
  padding: 14px 18px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 10px;
  transform: translateY(100px);
  opacity: 0;
  transition: transform .4s cubic-bezier(.2,.8,.2,1), opacity .4s;
  cursor: pointer;
}
.floating-badge.on { transform: translateY(0); opacity: 1; }
.floating-badge:hover { background: var(--mark); }
.floating-badge::before {
  content: '';
  width: 6px; height: 6px; border-radius: 50%;
  background: #6FE26F;
  animation: pulse 1.6s ease-in-out infinite;
}

/* ---------- Avatars ---------- */
.avatar-svg { display: block; width: 100%; height: 100%; }

.avatar-box {
  width: 100%;
  aspect-ratio: 1;
  overflow: hidden;
  border: 1px solid var(--rule);
  background: var(--cream);
  position: relative;
  transition: transform .35s cubic-bezier(.2,.8,.2,1);
}
.avatar-box.large {
  max-width: 380px;
}

/* Avatar in persona card */
.persona-card { padding-top: 0; }
.persona-card .avatar-box {
  border: none;
  border-bottom: 1px solid var(--rule);
  aspect-ratio: 1;
}
.persona-card .pinner {
  padding: 18px 22px 24px;
  position: relative;
}
.persona-card:hover .avatar-box { transform: scale(1.02); }

/* Avatar in result page */
.result-avatar {
  width: 100%;
  max-width: 360px;
  aspect-ratio: 1;
  border: 1px solid var(--rule);
  overflow: hidden;
  position: relative;
  margin-bottom: 24px;
}
.result-avatar::after {
  content: '';
  position: absolute;
  inset: 0;
  border: 1px solid var(--ink);
  pointer-events: none;
  opacity: 0.08;
}

/* Modal avatar */
.modal .mavatar {
  width: 100%;
  max-width: 240px;
  aspect-ratio: 1;
  margin-bottom: 24px;
  border: 1px solid var(--rule);
  overflow: hidden;
}

/* Share card avatar — replaces the "REDACTED" placeholder */
.share-card.id-card .body .avatar-mini {
  width: 90px;
  height: 90px;
  border: 1px solid var(--rule);
  overflow: hidden;
  margin: 0 auto 14px;
}
.share-card.wanted .avatar-wanted {
  width: 100%;
  aspect-ratio: 1.4;
  margin-top: 14px;
  border: 2px solid #1A140A;
  overflow: hidden;
  filter: grayscale(0.85) contrast(1.15);
}
.share-card.report .avatar-report {
  width: 60px;
  height: 60px;
  border: 1px solid rgba(255,255,255,0.3);
  overflow: hidden;
  margin-bottom: 14px;
}

/* Headline result avatar at right column */
.result-headline-wrap {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 48px;
  align-items: end;
  padding: 56px 0 48px;
  border-bottom: 1px solid var(--rule);
}
@media (max-width: 900px) {
  .result-headline-wrap { grid-template-columns: 1fr; }
}

/* ---------- Cursor stamp (on certain hovers) ---------- */
.cursor-stamp {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  width: 80px;
  height: 80px;
  border: 2px solid var(--stamp);
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--stamp);
  transform: translate(-50%, -50%) scale(0);
  transition: transform .3s cubic-bezier(.4,1.6,.5,1);
  background: rgba(178, 58, 31, 0.06);
  text-transform: uppercase;
  opacity: 0.85;
}
.cursor-stamp.on { transform: translate(-50%, -50%) scale(1); }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .topbar { grid-template-columns: 1fr auto; }
  .nav-meta { display: none; }
  .ranking-grid { grid-template-columns: 1fr; }
  .discover-strip { grid-template-columns: 1fr; gap: 20px; }
  .section-folio { font-size: 100px; opacity: 0.5; }
  .ticker-row { gap: 16px; font-size: 10px; }
  .stamp-impact { top: 20px; right: 0; font-size: 11px; padding: 6px 12px; }
  .couple-result .pct-big { font-size: 130px; }
  .floating-badge { right: 12px; bottom: 12px; padding: 10px 14px; font-size: 10px; }
  .hero-grid { grid-template-columns: 1fr; }
  .specimen { transform: rotate(-1deg); margin-top: 32px; }
  .hero-headline { font-size: 64px; }
  .cta-row { grid-template-columns: 1fr; }
  .method-grid { grid-template-columns: 1fr; }
  .persona-grid { grid-template-columns: repeat(2, 1fr); }
  .select-wrap { grid-template-columns: 1fr; }
  .result-headline { grid-template-columns: 1fr; }
  .result-body { grid-template-columns: 1fr; }
  .radar-wrap { grid-template-columns: 1fr; }
  .share-grid { grid-template-columns: 1fr; }
  .about-cols { grid-template-columns: 1fr; }
  .dict-grid { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; gap: 12px; }
  .bottombar { grid-template-columns: 1fr; gap: 10px; }
  .bottombar .center, .bottombar .right { text-align: left; }
}

/* =========================================================
   v6 — Diagnostic Letter + Lab Archive
   ========================================================= */

/* ---------- Diagnostic Letter ---------- */
.diag-letter-section {
  margin-top: 80px;
  padding: 56px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.diag-letter {
  position: relative;
  max-width: 760px;
  margin: 16px auto 0;
  padding: 56px 64px;
  background: linear-gradient(180deg, #FAF4E4 0%, #F5ECD5 100%);
  border: 1px solid #D8CCAE;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.4) inset,
    0 24px 60px rgba(40,30,15,0.10),
    0 4px 12px rgba(40,30,15,0.06);
  font-family: 'Noto Serif SC', var(--serif);
  font-size: 16px;
  line-height: 2.05;
  letter-spacing: 0.04em;
  color: #2A1F10;
  white-space: pre-wrap;
  border-radius: 1px;
}
.diag-letter::before {
  content: '';
  position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    180deg,
    rgba(180,160,110,0) 0px,
    rgba(180,160,110,0) 31px,
    rgba(180,160,110,0.10) 32px
  );
  pointer-events: none;
}
.diag-letter::after {
  content: '№ ' attr(data-letter-id);
  position: absolute;
  top: 18px; right: 22px;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.22em;
  color: rgba(60,40,20,0.45);
}
.diag-letter .seal {
  position: absolute;
  right: -14px; bottom: -14px;
  width: 96px; height: 96px;
  border: 2.5px solid #B53A2A;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: #B53A2A;
  text-align: center;
  line-height: 1.25;
  background: rgba(255,250,238,0.55);
  transform: rotate(-12deg);
  text-transform: uppercase;
  opacity: 0.92;
  box-shadow: 0 2px 6px rgba(120,40,30,0.18);
}
.diag-letter .seal::before {
  content: '';
  position: absolute; inset: 6px;
  border: 1px solid #B53A2A;
  border-radius: 50%;
}

.diag-actions {
  margin-top: 36px;
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}

/* letter unfurl animation */
.diag-letter.unfurl {
  animation: letter-unfurl 1.2s cubic-bezier(.2,.8,.2,1) both;
  transform-origin: top center;
}
@keyframes letter-unfurl {
  0%   { opacity: 0; transform: scaleY(0.02) translateY(-12px); }
  35%  { opacity: 1; transform: scaleY(0.08) translateY(-6px); }
  100% { opacity: 1; transform: scaleY(1)   translateY(0); }
}

/* ---------- Lab archive grid ---------- */
.lab-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  margin-bottom: 56px;
  padding: 32px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.lab-stats > div {
  text-align: left;
}
.lab-stats .v {
  font-family: var(--serif);
  font-size: clamp(40px, 5vw, 64px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.02em;
}
.lab-stats .l {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ash);
  margin-top: 10px;
}

.lab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 24px;
}
.lab-card {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--ink);
  padding: 0;
  overflow: hidden;
  transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
  cursor: pointer;
}
.lab-card:hover {
  transform: translateY(-4px) rotate(-0.4deg);
  box-shadow: 8px 12px 0 var(--ink);
}
.lab-card .lc-img {
  width: 100%; aspect-ratio: 1/1; overflow: hidden;
  background: var(--mut);
}
.lab-card .lc-img svg { width: 100%; height: 100%; display: block; }
.lab-card .lc-body {
  padding: 18px 18px 22px;
  border-top: 1px solid var(--ink);
}
.lab-card .lc-no {
  font-family: var(--mono); font-size: 9.5px;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ash);
}
.lab-card .lc-name {
  font-family: var(--serif); font-size: 24px;
  letter-spacing: -0.01em;
  margin: 6px 0 2px;
}
.lab-card .lc-pname {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--mark);
}
.lab-card .lc-del {
  position: absolute; top: 10px; right: 10px;
  width: 26px; height: 26px;
  background: rgba(255,255,255,0.85);
  border: 1px solid var(--ink);
  font-family: var(--mono); font-size: 10px;
  cursor: pointer;
  opacity: 0;
  transition: opacity .2s;
  z-index: 2;
}
.lab-card:hover .lc-del { opacity: 1; }
.lab-card .lc-compat {
  position: absolute; bottom: 14px; right: 14px;
  font-family: var(--mono); font-size: 9.5px;
  letter-spacing: 0.18em;
  background: var(--ink); color: var(--paper);
  padding: 5px 8px;
  text-transform: uppercase;
}
.lab-card .lc-date {
  position: absolute; bottom: 14px; left: 14px;
  font-family: var(--mono); font-size: 9.5px;
  letter-spacing: 0.16em; color: var(--ash);
}

.lab-empty {
  text-align: center; padding: 80px 24px;
}

/* ---------- Compatibility modal ---------- */
.compat-result {
  text-align: center;
  padding: 40px 32px;
}
.compat-result .pair {
  display: flex; align-items: center; justify-content: center;
  gap: 36px; margin-bottom: 32px;
}
.compat-result .pair > div { text-align: center; }
.compat-result .pair .av { width: 120px; height: 120px; border: 1px solid var(--ink); }
.compat-result .pair .av svg { width: 100%; height: 100%; }
.compat-result .x {
  font-family: var(--serif); font-style: italic;
  font-size: 56px; color: var(--mark);
}
.compat-result .pct {
  font-family: var(--serif); font-weight: 700;
  font-size: clamp(72px, 10vw, 128px);
  letter-spacing: -0.04em;
  line-height: 0.95;
}
.compat-result .pct .pct-it {
  color: var(--mark); font-style: italic;
}
.compat-result .verdict-title {
  margin-top: 12px;
  font-family: var(--mono); font-size: 12px;
  letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--mark);
}
.compat-result .verdict-text {
  margin-top: 18px;
  font-family: var(--serif); font-size: 19px;
  line-height: 1.5;
  max-width: 440px;
  margin-left: auto; margin-right: auto;
}

/* ---------- Cinematic page transitions ---------- */
.page-enter { animation: pageEnter .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes pageEnter {
  0%   { opacity: 0; transform: translateY(14px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* Letter font (Chinese serif soft override) */
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap');

@keyframes fadeOut {
  0%, 70% { opacity: 1; transform: translateX(-50%) translateY(0); }
  100% { opacity: 0; transform: translateX(-50%) translateY(8px); }
}

@media (max-width: 720px) {
  .diag-letter { padding: 36px 24px; font-size: 15px; }
  .lab-stats { grid-template-columns: repeat(2, 1fr); gap: 16px; }
}

/* =========================================================
   v7 — Confession Wall + Daily Gazette
   ========================================================= */

/* ----- Confession Wall ----- */
.wall-input {

.wall-count {

.wall-tabs {

.wall-tab {

.wall-grid {

.wall-note {

  border: 1px solid #C8B998;

.wall-note:nth-child(3n)    { background: #F4ECDA; transform: rotate(-0.4deg); }
.wall-note:nth-child(5n)    { background: #F0E6CC; transform: rotate(0.3deg); }
.wall-note:nth-child(7n)    { background: #FAF0E0; transform: rotate(-0.2deg); }
.wall-note:hover { transform: translateY(-3px) rotate(0); box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 8px 8px 0 rgba(40,30,15,0.08); }
.wall-note .wn-no {
  font-family: var(--mono); font-size: 9.5px;
  letter-spacing: 0.22em; color: rgba(60,40,20,0.6);

}
.wall-note .wn-sp {
  display: inline-block;
  font-family: var(--mono); font-size: 8.5px;
  letter-spacing: 0.18em;
  padding: 2px 6px;
  background: var(--ink); color: var(--paper);

}
.wall-note .wn-note {
  position: absolute; bottom: 14px; left: 24px; right: 24px;
  font-family: var(--mono); font-size: 10px;

  border-top: 1px dashed #B8A57A;

}
.wall-note .wn-note::before {

}
.wall-note .wn-del {
  position: absolute; top: 8px; right: 10px;
  width: 22px; height: 22px;
  font-family: var(--mono); font-size: 10px;

  cursor: pointer;
  opacity: 0;
  transition: opacity .2s;
}
.wall-note:hover .wn-del { opacity: 1; }
.wall-note.mine::after {
  content: 'MINE';

  letter-spacing: 0.2em;
  color: var(--mark);
  background: rgba(229,85,85,0.08);

/* ----- Daily Gazette ----- */
.daily-date-row {

.daily-date {

.daily-horos-box .horos-av svg { width: 100%; height: 100%; }
.daily-horos-box .horos-name {

.daily-horos-box .horos-tag {

.daily-empty-cta {

.foyer-room.featured .fr-room { color: rgba(239,232,218,0.65); }
.foyer-room.featured .fr-arr { color: var(--paper); }
.foyer-room .fr-room {

.foyer-room .fr-name {

/* ----- TODAY (home) ----- */
.qr-today {

.qr-today-head {

}
.qr-date {
  font-family: var(--serif); font-weight: 700;

}
.qr-meta-row {
  display: flex; gap: 28px; flex-wrap: wrap;

.qr-archive-link {

  background: var(--ink); color: var(--paper);

/* The Letter */
.qr-letter {
  position: relative;
  max-width: 720px;
  margin: 0 auto;
  padding: 80px 76px;
  background:
    linear-gradient(180deg, #FAF5E6 0%, #F5EBD2 50%, #F0E4C4 100%);
  border: 1px solid #D0BE96;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.5) inset,
    0 32px 80px rgba(50,35,15,0.13),
    0 6px 16px rgba(50,35,15,0.08);
  font-family: 'Noto Serif SC', var(--serif);
  color: #1F1810;
}
.qr-letter::before {
  content: '';
  position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    180deg,
    rgba(180,160,110,0) 0px,
    rgba(180,160,110,0) 35px,
    rgba(180,160,110,0.07) 36px
  );
  pointer-events: none;
}
.qr-letter-stamp {
  position: absolute;
  top: 32px; right: 32px;
  font-family: 'Noto Serif SC', var(--serif);
  font-size: 22px;
  letter-spacing: 0.45em;
  color: #B53A2A;
  border: 2px solid #B53A2A;
  padding: 6px 12px 6px 18px;
  background: rgba(255,250,238,0.4);
  transform: rotate(-4deg);
  font-weight: 700;
  z-index: 2;
}
.qr-letter-addr {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 10.5px;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(60,40,20,0.55);
  margin-bottom: 36px;
  padding-bottom: 16px;
  border-bottom: 1px dashed rgba(120,90,40,0.3);
  position: relative;
}
.qr-letter-title {
  font-family: var(--serif); font-weight: 700;
  font-size: clamp(36px, 4.5vw, 56px);
  letter-spacing: -0.025em; line-height: 1.1;
  margin: 6px 0 22px;
  position: relative;
}
.qr-letter-intro {
  font-family: 'Noto Serif SC', var(--serif);
  font-style: italic;
  font-size: 18px;
  color: rgba(50,35,15,0.75);
  line-height: 1.6;
  margin-bottom: 32px;
  letter-spacing: 0.02em;
  position: relative;
}
.qr-letter-body {
  font-family: 'Noto Serif SC', var(--serif);
  font-size: 18px;
  line-height: 2.1;
  letter-spacing: 0.04em;
  color: #1F1810;
  white-space: pre-wrap;
  position: relative;
}
.qr-letter-sig {
  margin-top: 56px;
  text-align: right;
  font-family: var(--serif); font-style: italic;
  font-size: 17px;
  color: rgba(50,35,15,0.7);
  position: relative;
}
.qr-letter-sig::before {
  content: '—'; margin-right: 8px;
}

/* The Prompt */
.qr-prompt {
  max-width: 720px;
  margin: 56px auto 0;
  padding: 36px 40px 32px;
  border: 1.5px solid var(--ink);
  background: var(--paper);
  position: relative;
}
.qr-prompt-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px; flex-wrap: wrap; gap: 8px;
}
.qr-prompt-meta {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ash);
}
.qr-prompt-q {
  font-family: var(--serif); font-weight: 700;
  font-size: clamp(22px, 2.6vw, 32px);
  line-height: 1.35; letter-spacing: -0.015em;
  margin: 8px 0 22px;
}
.qr-prompt-input {
  width: 100%; min-height: 100px;
  border: none; outline: none;
  background: transparent;
  font-family: 'Noto Serif SC', var(--serif);
  font-size: 18px;
  line-height: 1.65;
  color: var(--ink);
  resize: vertical;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.qr-prompt-input::placeholder {
  color: var(--ash); font-style: italic;
}
.qr-prompt-foot {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 18px;
}
.qr-prompt-count {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.2em; color: var(--ash);
}
.qr-prompt-saved {
  margin-top: 18px; padding-top: 18px;
  border-top: 1px dashed var(--line);
  font-family: var(--serif); font-style: italic;
  color: var(--mark);
  font-size: 15px;
}
.qr-prompt-saved a {
  margin-left: 12px;
  border-bottom: 1px solid var(--mark);
  font-style: normal;
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.18em; text-transform: uppercase;
  padding-bottom: 2px;
}

/* What is this */
.qr-what {
  padding: 96px 0 80px;
  border-bottom: 1.5px solid var(--ink);
}
.qr-what-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 80px;
}
.qr-what-h2 {
  font-family: var(--serif); font-weight: 700;
  font-size: clamp(40px, 6vw, 84px);
  letter-spacing: -0.03em; line-height: 1.02;

.qr-what-p {
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.65;
  margin-bottom: 22px;
  color: #2A2620;
}
.qr-what-rules {
  background: var(--mut);
  padding: 36px 36px;
  border: 1.5px solid var(--ink);
}
.qr-what-rules ol {
  padding-left: 22px;
  font-family: 'Noto Serif SC', var(--serif);
  font-size: 16px;
  line-height: 1.8;
}
.qr-what-rules li { margin-bottom: 10px; }

/* Other rooms */
.qr-rooms-section { padding: 80px 0; }
.qr-rooms {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-top: 32px;
}
.qr-room {
  padding: 24px 22px 28px;
  border: 1.5px solid var(--ink);
  background: var(--paper);
  text-decoration: none;
  color: inherit;
  transition: all .2s;
  display: flex; flex-direction: column;
}
.qr-room:hover { transform: translateY(-3px); box-shadow: 4px 4px 0 var(--ink); }
.qr-room-no {
  font-family: var(--mono); font-size: 9.5px;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ash); margin-bottom: 14px;
}
.qr-room-name {
  font-family: var(--serif); font-weight: 700;
  font-size: 24px; letter-spacing: -0.015em;
  margin-bottom: 6px;
}
.qr-room-sub {
  font-family: var(--serif); font-style: italic;
  font-size: 13px; color: var(--ash); line-height: 1.45;
}

/* ----- Archive (past letters) ----- */
.archive-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  max-width: 920px;
}
.archive-row {
  display: grid;
  grid-template-columns: 130px 1fr auto;
  align-items: center;
  gap: 24px;
  padding: 28px 32px;
  border: 1.5px solid var(--ink);
  background: var(--paper);
  cursor: pointer;
  transition: all .2s;
  text-decoration: none;
  color: inherit;
}
.archive-row:hover { background: var(--mut); transform: translateX(4px); }
.archive-row .ar-date {
  font-family: var(--mono); font-size: 12px;
  letter-spacing: 0.22em; color: var(--mark);
  text-transform: uppercase;
}
.archive-row .ar-title {
  font-family: var(--serif); font-weight: 700;
  font-size: clamp(22px, 2.2vw, 30px);
  letter-spacing: -0.015em;
  line-height: 1.2;
}
.archive-row .ar-intro {
  font-family: var(--serif); font-style: italic;
  font-size: 14px; color: var(--ash);
  margin-top: 4px;
  line-height: 1.45;
}
.archive-row .ar-arr {
  font-size: 20px;
}
.archive-row.today {
  background: var(--ink); color: var(--paper);
}
.archive-row.today .ar-date { color: rgba(239,232,218,0.7); }
.archive-row.today .ar-intro { color: rgba(239,232,218,0.7); }
.archive-row.today .ar-badge {
  display: inline-block;
  font-family: var(--mono); font-size: 8.5px;
  letter-spacing: 0.22em; padding: 3px 6px;
  background: var(--mark); color: #fff;
  margin-left: 10px;
}

/* Archive modal */
.archive-modal {
  position: fixed; inset: 0; z-index: 1000;
  align-items: center; justify-content: center;
  display: flex;
}
.archive-modal-bg {
  position: absolute; inset: 0;
  background: rgba(20,18,15,0.78);
  backdrop-filter: blur(6px);
}
.archive-modal-inner {
  position: relative;
  max-width: 720px;
  max-height: 88vh;
  overflow-y: auto;
  margin: 24px;
  background: var(--paper);
}
.archive-modal-close {
  position: sticky; top: 0;
  width: 100%;
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.2em; text-transform: uppercase;
  background: var(--ink); color: var(--paper);
  padding: 14px;
  border: none; cursor: pointer;
  z-index: 2;
}
.archive-modal-content {
  padding: 0;
}

/* ----- Journal (replies) ----- */
.journal-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  padding: 32px 0 48px;
  border-bottom: 1.5px solid var(--ink);
  margin-bottom: 56px;
}
.journal-stats .v {
  font-family: var(--serif); font-weight: 700;
  font-size: clamp(48px, 5vw, 84px);
  letter-spacing: -0.025em; line-height: 1;
}
.journal-stats .l {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ash); margin-top: 10px;
}

.journal-list { display: flex; flex-direction: column; gap: 24px; }
.journal-entry {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 32px;
  padding: 36px 38px;
  border: 1.5px solid var(--ink);
  background: #FAF5E6;
  position: relative;
}
.journal-entry .je-date {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.22em; color: var(--mark);
}
.journal-entry .je-no {
  font-family: var(--mono); font-size: 9.5px;
  letter-spacing: 0.2em; color: var(--ash);
  margin-top: 6px;
}
.journal-entry .je-q {
  font-family: var(--serif); font-style: italic;
  font-size: 16px; color: var(--ash);
  line-height: 1.5;
  margin-bottom: 16px;
  padding-bottom: 14px;
  border-bottom: 1px dashed rgba(60,40,20,0.2);
}
.journal-entry .je-q::before { content: 'Q. '; color: var(--mark); }
.journal-entry .je-a {
  font-family: 'Noto Serif SC', var(--serif);
  font-size: 19px;
  line-height: 1.75;
  letter-spacing: 0.03em;
  color: #1F1810;
  white-space: pre-wrap;
}
.journal-entry .je-del {
  position: absolute; top: 14px; right: 14px;
  width: 28px; height: 28px;
  background: transparent;
  border: 1px solid var(--ink);
  font-family: var(--mono); font-size: 10px;
  cursor: pointer;
  opacity: 0;
  transition: opacity .2s;
}
.journal-entry:hover .je-del { opacity: 1; }
.journal-empty {
  text-align: center; padding: 80px 24px;
}

@media (max-width: 900px) {
  .qr-letter { padding: 48px 28px 56px; }
  .qr-prompt { padding: 28px 24px 24px; margin-top: 36px; }
  .qr-what-grid { grid-template-columns: 1fr; gap: 40px; }
  .qr-rooms { grid-template-columns: repeat(2, 1fr); }
  .archive-row { grid-template-columns: 1fr; gap: 8px; padding: 22px 22px; }
  .archive-row .ar-arr { display: none; }
  .journal-entry { grid-template-columns: 1fr; gap: 16px; padding: 28px 24px; }
  .journal-stats { grid-template-columns: repeat(3, 1fr); gap: 12px; }
}

template { display: none; }

/* =========================================================
   DIAGNOSTIC LETTER · 实验室诊断信生成器
   生成一封 ~180 字的拟人化"主诊医师致信"
   ========================================================= */
function generateLetter(r) {
  const sp = r.species;
  const name = r.petName || (sp === 'cat' ? '小猫' : sp === 'dog' ? '小狗' : '小兔');
  const code = r.main.code;
  const pname = r.main.name;
  const match = r.match;
  const top = Object.entries(r.vector).sort((a,b)=>b[1]-a[1]).slice(0,2);

  const openings = [
    `亲爱的${name}的监护人：`,
    `致${name}的法定人类：`,
    `${name}的同居人，您好：`,
    `${name}所属家庭成员，启：`,
  ];
  const declarations = [
    `经本实验室连续 ${10 + (r.id ? +(''+r.id).slice(-1) % 9 : 3)} 个工作日的非侵入式观察，结合您提供的行为问卷，我们已为${name}建立独立行为档案，编号 PT-${r.id}。`,
    `感谢您将${name}的行为样本提交至我们的档案系统。经多维度交叉比对，本案已归档于"${pname}"型卷宗。`,
    `本案已完成全部 12 项行为指标评估。${name}在我们的档案库中被分类为"${pname}"（${code}型，匹配度 ${match}%）。`,
  ];
  const dimLine = `其中【${top[0][0]}·${r.dims[top[0][0]].name}】与【${top[1][0]}·${r.dims[top[1][0]].name}】两项尤为突出，构成${name}最核心的行为底色。`;

  const analysisBySpecies = {
    cat: [
      `${name}并非"普通家猫"，它更像一只持有家庭股权的合伙人，行使着安静却不可忽视的支配力。`,
      `${name}对您的依恋方式不同于常见的"主人—宠物"线性结构，更接近一种带有距离感的合伙关系。`,
      `观察显示${name}具备成熟的边界意识，其情感传递常以"出现"而非"接触"完成。`,
    ],
    dog: [
      `${name}是一种由情绪驱动的存在，几乎所有行为都指向同一个目标——与您建立更紧密的连接。`,
      `${name}的世界观以"群体—忠诚—边界"三轴构成，您是它情感坐标系的原点。`,
      `${name}的能量并非用于生存，而是用于回应——回应您、回应世界、回应任何变化。`,
    ],
    rab: [
      `${name}属于典型的兔科建筑师人格，对空间、节奏与所有权有着明确的内在秩序。`,
      `${name}的信任体系是渐进式而非一次性的，每一次贴近都意味着一次内部审议的结果。`,
      `${name}虽体型小巧，但其领地意识与情绪自治程度可媲美中型犬。`,
    ],
  };
  const analysis = pick(analysisBySpecies[sp] || analysisBySpecies.cat);

  const prescriptions = [
    `本所建议：${r.main.tips[0]}；同时${r.main.tips[1]}。这两项配合执行，可显著改善您与${name}的共处效率。`,
    `处方一：${r.main.tips[0]}。处方二：${r.main.tips[1]}。两周内观察情绪曲线，复诊免预约。`,
    `若需进一步介入，建议优先尝试：${r.main.tips[0]}。其余生活习惯无需调整。${name}所呈现的，正是它本来的样子。`,
  ];
  const prescription = pick(prescriptions);

  const closings = [
    `——\n以上结论仅作行为参考，不构成医疗诊断。\n${name}的存在本身，已是您所有问题的答案。`,
    `——\n此报告由 PetTI Laboratory 出具，未加印鉴亦具效力。\n望您与${name}长长久久。`,
    `——\n本实验室谨向${name}致以最高敬意。\n它没有错，从来没有。`,
  ];

  const sigs = [
    `\nPetTI Laboratory · 主诊员\n林 · 已签`,
    `\nPetTI 鉴定所 · 行为观察组\n谨 启`,
    `\n国民宠物精神档案馆\n第三鉴定室`,
  ];

  return [
    pick(openings),
    '',
    pick(declarations),
    dimLine,
    '',
    analysis,
    '',
    prescription,
    '',
    pick(closings),
    pick(sigs),
  ].join('\n');
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

   PetTI · App Logic
   ========================================================= */

const STORE_KEY = 'petti.session.v1';
const RESULT_KEY = 'petti.result.v1';

const Store = {
  save(d) { localStorage.setItem(STORE_KEY, JSON.stringify(d)); },
  load() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch { return null; } },
  saveResult(d) { localStorage.setItem(RESULT_KEY, JSON.stringify(d)); },
  loadResult() { try { return JSON.parse(localStorage.getItem(RESULT_KEY) || 'null'); } catch { return null; } },
  clear() { localStorage.removeItem(STORE_KEY); },
};

function randomId() {
  return String(Math.floor(100000 + Math.random() * 899999));
}

function todayCode() {
  const d = new Date();
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}

/* normalize raw dimension scores to 0-100 */
function normalize(scores, dims) {
  const out = {};
  Object.keys(dims).forEach(k => {
    const raw = scores[k] || 0;
    // assume raw range -6 ~ +24
    const v = Math.max(0, Math.min(100, Math.round(((raw + 6) / 30) * 100)));
    out[k] = v;
  });
  return out;
}

function cosineSim(a, b, keys) {
  let dot = 0, na = 0, nb = 0;
  keys.forEach(k => {
    const x = a[k] || 0;
    const y = b[k] || 0;
    dot += x * y;
    na += x * x;
    nb += y * y;
  });
  if (na === 0 || nb === 0) return 0;
  return dot / (Math.sqrt(na) * Math.sqrt(nb));
}

function matchPersona(vec, personas, dims) {
  const keys = Object.keys(dims);
  const scored = personas.map(p => ({
    p,
    sim: cosineSim(vec, p.vector, keys),
  })).sort((a,b) => b.sim - a.sim);
  // map sim (0.7-1.0) -> 78-99
  const main = scored[0];
  const sub = scored[1];
  const match = Math.round(78 + (main.sim - 0.7) / 0.3 * 21);
  return {
    main: main.p,
    sub: sub.p,
    match: Math.max(78, Math.min(99, match)),
  };
}

function speciesPack(species) {
  if (species === 'cat') return { Q: PETTI_DATA.CAT_QUESTIONS, DIMS: PETTI_DATA.CAT_DIMS, PERS: PETTI_DATA.CAT_PERSONAS };
  if (species === 'dog') return { Q: PETTI_DATA.DOG_QUESTIONS, DIMS: PETTI_DATA.DOG_DIMS, PERS: PETTI_DATA.DOG_PERSONAS };
  return { Q: PETTI_DATA.RAB_QUESTIONS, DIMS: PETTI_DATA.RAB_DIMS, PERS: PETTI_DATA.RAB_PERSONAS };
}
function speciesLabel(species) {
  if (species === 'cat') return 'CatTI · 猫格鉴定';
  if (species === 'dog') return 'DogTI · 狗格鉴定';
  return 'RabTI · 兔格鉴定';
}
function speciesLatin(species) {
  if (species === 'cat') return 'CatTI / Felis catus';
  if (species === 'dog') return 'DogTI / Canis familiaris';
  return 'RabTI / Oryctolagus cuniculus';
}
function speciesDefault(species) {
  if (species === 'cat') return '小猫';
  if (species === 'dog') return '小狗';
  return '小兔';
}

function computeResult(species, answers) {
  const { Q, DIMS, PERS } = speciesPack(species);
  const raw = {};
  Object.keys(DIMS).forEach(k => raw[k] = 0);
  answers.forEach((ans, i) => {
    const opt = Q[i].opts[ans];
    if (!opt) return;
    Object.entries(opt.s).forEach(([k, v]) => {
      raw[k] = (raw[k] || 0) + v;
    });
  });
  const vec = normalize(raw, DIMS);
  const match = matchPersona(vec, PERS, DIMS);
  return {
    species,
    dims: DIMS,
    vector: vec,
    main: match.main,
    sub: match.sub,
    match: match.match,
    id: randomId(),
    date: todayCode(),
  };
}
